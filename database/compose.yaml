services:
  user_data:
    image: postgres
    container_name: postgres_test_db
    restart: always

    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_data

    ports:
      - "1324:5432"

  measurement_data:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongodb

    volumes:
      - ./mongodb-init:/docker-entrypoint-initdb.d

  mongo-express:
    image: mongo-express
    restart: always
    depends_on:
      - measurement_data
    ports:
      - 1325:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:mongodb@measurement_data:27017/
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongodb
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongodb
      ME_CONFIG_MONGODB_SERVER: measurement_data
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: mongodb
      ME_CONFIG_BASICAUTH_PASSWORD: mongodb
